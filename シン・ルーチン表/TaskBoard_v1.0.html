<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="時刻順のタスクを未対応・対応中・完了へドラッグして管理。共有フォルダ、期限リマインド、ライト／ダークモードに対応。">
<title>タスク管理</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%2064%2064'%3E%3Cstyle%3E.tile%7Bfill%3A%23d9def4%7D.task%7Bfill%3Anone%3Bstroke%3A%2335436b%3Bstroke-width%3A3%3Bstroke-linecap%3Around%3Bstroke-linejoin%3Around%7D%40media(prefers-color-scheme%3Adark)%7B.tile%7Bfill%3A%23303545%7D.task%7Bstroke%3A%23d0d7f4%7D%7D%3C%2Fstyle%3E%3Crect%20class%3D'tile'%20width%3D'64'%20height%3D'64'%20rx%3D'16'%2F%3E%3Cg%20class%3D'task'%3E%3Crect%20x%3D'16'%20y%3D'12'%20width%3D'32'%20height%3D'40'%20rx%3D'5'%2F%3E%3Cpath%20d%3D'm22%2024%203%203%205-6M35%2025h7m-20%2013%203%203%205-6M35%2039h7'%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E">
<style>
:root {
  color-scheme: light dark;
  --bg:#f2f1ef; --surface:#faf9f7; --ink:#2c2f38; --muted:#656873; --line:#d6d6de;
  --accent:#d9def4; --accent-hover:#cbd2ee; --on-accent:#35436b; --accent-line:#9aa7cf; --accent-ink:#4d5f99; --soft:#ebeaf2;
  --pending:#f4e4e8; --pending-line:#e6c6cf; --pending-ink:#8a4757; --pending-dot:#b87c8a;
  --progress:#e3edf8; --progress-line:#bfcfe2; --progress-ink:#486385; --progress-dot:#6d91bb;
  --done:#e8e8ec; --done-line:#d0d1d8; --done-ink:#636670; --done-dot:#9698a3;
  --danger:#96354b; --danger-bg:#f7dfe4; --danger-line:#c35f76;
  --shadow:0 3px 14px #1c1e260b; --modal-shadow:0 24px 100px #0003;
}
@media(prefers-color-scheme:dark) {
  :root {
    --bg:#121214; --surface:#202023; --ink:#e8e8ed; --muted:#b0b0bc; --line:#3c3c44;
    --accent:#bfc7ed; --accent-hover:#d0d7f4; --on-accent:#20263f; --accent-line:#8998d3; --accent-ink:#bfc7ed; --soft:#2c2c33;
    --pending:#35262c; --pending-line:#60444d; --pending-ink:#e4b2c0; --pending-dot:#c48d9e;
    --progress:#242d3d; --progress-line:#425572; --progress-ink:#b9cdef; --progress-dot:#90acda;
    --done:#29292e; --done-line:#41414b; --done-ink:#bcbcc8; --done-dot:#9696a6;
    --danger:#f2afbe; --danger-bg:#472832; --danger-line:#c97087;
    --shadow:0 3px 14px #0002; --modal-shadow:0 24px 100px #0007;
  }
}
* {box-sizing:border-box}
body {margin:0; background:var(--bg); color:var(--ink); font:15px/1.6 "Yu Gothic UI","Hiragino Kaku Gothic ProN",Meiryo,system-ui,sans-serif}
button,input,textarea,select {font:inherit}
button {cursor:pointer; color:inherit}
button:disabled {opacity:.5; cursor:wait}
#add-button:disabled,.column-add:disabled {cursor:not-allowed}
button:focus-visible,summary:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,[tabindex]:focus-visible {
  outline:3px solid var(--progress-dot); outline-offset:3px;
}
button {touch-action:manipulation}
[hidden] {display:none!important}
svg.icon {width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.app {max-width:1880px; margin:0 auto; padding:32px 40px 20px}
.header {position:relative;display:flex;align-items:center;justify-content:space-between;gap:24px;margin-bottom:28px}
.brand {display:flex;align-items:center;gap:14px}
.brand-mark {width:46px;height:46px;border-radius:14px;display:flex;gap:4px;align-items:center;justify-content:center;background:var(--accent);color:var(--on-accent);padding:11px 9px;box-shadow:var(--shadow)}
.brand-mark .icon {width:27px;height:27px;stroke-width:2}
.eyebrow {font-size:10px;font-weight:700;letter-spacing:2.2px;color:var(--muted);line-height:1.3;margin-bottom:3px}
h1 {font-size:25px;line-height:1.4;letter-spacing:.02em;margin:0;font-weight:700}
.header-right {display:flex;align-items:center;gap:18px}
.clock {font-variant-numeric:tabular-nums;font-size:26px;font-weight:600;letter-spacing:.035em;line-height:1.3}
.clock small {font-size:11px;font-weight:500;color:var(--muted);display:block;text-align:right;letter-spacing:.08em}
.button {display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:10px 15px;border-radius:11px;font-size:13px;font-weight:600;white-space:nowrap;transition:background .15s,transform .15s}
.button:hover {background:var(--soft)}
.button.primary {background:var(--accent);color:var(--on-accent);border-color:var(--accent-line)}
.button.primary:hover {background:var(--accent-hover)}
.button.small {padding:7px 11px;font-size:12px;border-radius:9px}
.button.text {background:transparent;border-color:transparent;color:var(--muted)}
.button.text:hover {background:var(--soft);color:var(--ink)}
.icon-button {width:32px;height:32px;border:0;border-radius:9px;background:transparent;display:inline-flex;align-items:center;justify-content:center}
.icon-button:hover {background:var(--surface)}
.toolbar {display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px}
.date-group {display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.date-shell {display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:8px 12px;position:relative}
.date-shell .icon {color:var(--muted)}
.date-shell input {position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;padding:0;border:0;cursor:pointer}
.date-shell input::-webkit-calendar-picker-indicator {position:absolute;inset:0;width:100%;height:100%;margin:0;padding:0;cursor:pointer}
.date-shell:focus-within {outline:3px solid var(--progress-dot);outline-offset:3px}
.date-display {min-width:142px;color:var(--ink);font-size:13px;font-weight:600;padding:2px 0}
.date-shortcuts {display:flex;gap:4px}
.date-shortcuts .button[aria-pressed="true"] {background:var(--accent);color:var(--on-accent);border-color:var(--accent-line)}
.date-shortcuts .button:disabled {opacity:1;cursor:default}
.toolbar-right {display:flex;align-items:center;gap:16px}
.search {display:flex;align-items:center;gap:8px;max-width:300px;min-width:200px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--muted)}
.search input {border:0;outline:none;background:transparent;color:var(--ink);width:100%;min-width:0;font-size:12px}
.search:focus-within {outline:2px solid var(--progress-dot);outline-offset:2px}
.mine-filter {padding:9px 12px;font-size:12px}
.mine-filter[aria-pressed="true"] {background:var(--accent);color:var(--on-accent);border-color:var(--accent-line)}
.profile-button .button-label {max-width:100px;overflow:hidden;text-overflow:ellipsis}
.summary {display:flex;align-items:center;justify-content:space-between;gap:20px;border-top:1px solid var(--line);padding:17px 0 18px}
.summary-title {font-size:14px;font-weight:600}
.summary-title span {font-size:12px;font-weight:400;color:var(--muted);margin-left:10px}
.progress-group {display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;min-width:180px}
.progress-track {width:100px;height:5px;background:var(--line);border-radius:8px;overflow:hidden}
.progress-fill {height:100%;background:var(--accent-ink);border-radius:8px;transition:width .2s}
.reminder {display:flex;align-items:center;gap:12px;background:var(--danger-bg);color:var(--danger);border:1px solid var(--pending-line);border-radius:12px;padding:12px 16px;margin-bottom:18px;font-size:13px}
.reminder strong {font-weight:650}
.reminder .button {margin-left:auto;color:var(--danger);background:transparent;border-color:var(--danger-line)}
.system-message {padding:10px 14px;background:var(--surface);border:1px solid var(--danger-line);color:var(--danger);border-radius:10px;font-size:12px;margin-bottom:16px}
.board {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;align-items:stretch}
.column {border:1px solid var(--line);border-radius:16px;background:color-mix(in srgb,var(--surface) 48%,transparent);display:flex;flex-direction:column;min-height:calc(100dvh - 292px);transition:background .15s,border-color .15s}
.column.pending {--tone:var(--surface);--tone-line:var(--line);--tone-ink:var(--muted);--dot:var(--muted)}
.column.progress {--tone:var(--progress);--tone-line:var(--progress-line);--tone-ink:var(--progress-ink);--dot:var(--progress-dot)}
.column.done {--tone:var(--done);--tone-line:var(--done-line);--tone-ink:var(--done-ink);--dot:var(--done-dot)}
.column.drag-over {background:var(--tone);border-color:var(--dot);box-shadow:inset 0 0 0 1px var(--dot)}
.column-head {padding:19px 20px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.column-title {display:flex;align-items:center;gap:9px;font-size:14px;font-weight:700;margin:0}
.status-dot {width:8px;height:8px;border-radius:50%;background:var(--dot)}
.column-count {padding:1px 8px;min-width:25px;line-height:1.6;border-radius:7px;background:var(--tone);color:var(--tone-ink);font-size:11px;font-weight:600}
.column-head .icon-button {color:var(--muted);width:26px;height:26px}
.card-list {padding:0 14px 14px;flex:1;min-height:270px}
.task-card {border:1px solid var(--tone-line);background:var(--tone);border-radius:10px;padding:10px 12px;position:relative;margin-bottom:8px;box-shadow:var(--shadow);cursor:grab;transition:box-shadow .15s,transform .15s,border-color .15s}
.task-card:last-child {margin-bottom:0}
.task-card:hover {box-shadow:0 5px 18px #1c1e2617;transform:translateY(-1px)}
.task-card:active:not(:has(button:active,input:active,select:active,textarea:active,.card-menu:active)) {cursor:grabbing;transform:scale(.97)}
.task-card.dragging {opacity:.45;cursor:grabbing;transform:scale(.97)}
.task-card.overdue {background:var(--danger-bg);border-color:var(--danger-line);box-shadow:inset 3px 0 0 var(--danger-line),var(--shadow)}
.task-card:focus {scroll-margin:80px}
.card-row {display:grid;grid-template-columns:64px minmax(0,1fr) minmax(78px,118px) 55px;align-items:center;gap:10px;min-height:40px}
.card-time-block {min-width:0}
.card-time {display:flex;align-items:center;gap:5px;color:var(--tone-ink);font-size:16px;font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:.01em;white-space:nowrap}
.card-time .icon {width:13px;height:13px;opacity:.8}
.overdue .card-time {color:var(--danger)}
.done .card-time {color:var(--done-ink)}
.card-buttons {display:flex;align-items:center;gap:1px;color:var(--tone-ink)}
.card-buttons .icon-button {width:27px;height:27px}
.expand-button .icon {width:16px;height:16px;transition:transform .15s}
.expand-button[aria-expanded="true"] .icon {transform:rotate(45deg)}
.task-title {font-size:14px;font-weight:600;line-height:1.55;margin:0;min-width:0;overflow-wrap:anywhere;white-space:pre-wrap}
.card-assignees {display:flex;flex-direction:column;gap:2px;min-width:0}
.assignee {display:flex;align-items:center;gap:5px;color:var(--tone-ink);font-size:11px;line-height:1.6;min-width:0}
.assignee-slot {flex-shrink:0;font-size:10px;opacity:.75}
.assignee-name {min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.late-label {font-size:9px;font-weight:700;color:var(--danger);display:block;white-space:nowrap;line-height:1.4;margin-top:2px}
.card-notes {border-top:1px solid var(--tone-line);padding-top:9px;margin-top:10px}
.notes-label {color:var(--tone-ink);font-size:10px;letter-spacing:.06em;font-weight:650;margin-bottom:5px}
.notes-text {font-size:12px;line-height:1.8;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--ink)}
.card-menu {position:fixed;left:0;top:0;z-index:20;width:170px;max-width:calc(100vw - 16px);padding:5px;border:1px solid var(--line);background:var(--surface);border-radius:10px;box-shadow:0 12px 30px #0002;cursor:default;overflow-y:auto;overscroll-behavior:contain}
.card-menu button {display:flex;gap:8px;align-items:center;border:0;background:transparent;width:100%;text-align:left;padding:9px 10px;border-radius:6px;font-size:12px}
.card-menu button:hover {background:var(--soft)}
.card-menu button.danger {color:var(--danger)}
.menu-divider {height:1px;background:var(--line);margin:4px}
.empty {min-height:245px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:24px 16px}
.empty-art {width:50px;height:58px;margin-bottom:10px;position:relative}
.empty-art:before,.empty-art:after {content:"";position:absolute;width:35px;height:42px;border:1.5px solid var(--tone-line);border-radius:6px;background:var(--tone);top:6px;left:4px;transform:rotate(-9deg)}
.empty-art:after {top:10px;left:13px;transform:rotate(7deg);background:var(--surface)}
.empty strong {font-size:12px;font-weight:550;color:var(--tone-ink)}
.empty p {margin:0;font-size:11px;color:var(--muted)}
.footer {display:flex;align-items:center;justify-content:flex-end;gap:16px;padding-top:15px;color:var(--muted);font-size:11px}
.footer-actions {display:flex;align-items:center;gap:4px}
.footer-actions .button {font-size:11px;padding:5px 8px}
dialog {width:min(520px,calc(100% - 32px));border:1px solid var(--line);border-radius:19px;padding:0;background:var(--surface);color:var(--ink);box-shadow:var(--modal-shadow);max-height:calc(100dvh - 40px)}
dialog::backdrop {background:#12121466;backdrop-filter:blur(3px)}
.dialog-head {display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px 26px 17px;border-bottom:1px solid var(--line)}
.dialog-head h2 {font-size:19px;margin:0;line-height:1.5}
.dialog-head p {font-size:11px;color:var(--muted);margin:3px 0 0}
.dialog-body {padding:22px 26px}
.field {margin-bottom:17px}
.field:last-child {margin-bottom:0}
.field label {display:block;font-size:12px;font-weight:650;margin-bottom:6px}
.field label span {font-weight:400;color:var(--muted);font-size:10px;margin-left:5px}
.field input,.field textarea,.field select {width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:10px 12px;outline:none;font-size:13px}
.field input:focus,.field textarea:focus,.field select:focus {border-color:var(--progress-dot);outline:2px solid color-mix(in srgb,var(--progress-dot) 25%,transparent)}
.field textarea {resize:vertical;min-height:105px;max-height:230px;line-height:1.8}
.field-row {display:grid;grid-template-columns:1fr 1fr;gap:16px}
.field-label-row {display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.field-label-row label {margin-bottom:0}
.field-label-row .button {padding:4px 7px;font-size:11px;color:var(--accent-ink)}
.field-label-row .icon {width:14px;height:14px}
.dialog-foot {display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:16px 26px 22px}
.form-error {padding:10px 12px;background:var(--danger-bg);color:var(--danger);border-radius:8px;font-size:12px;margin-top:16px;white-space:pre-wrap}
.share-settings > summary {list-style:none;cursor:pointer;user-select:none}
.share-settings > summary::-webkit-details-marker {display:none}
.share-settings .settings-chevron {width:14px;height:14px;transform:rotate(90deg)}
.share-settings[open] .settings-chevron {transform:rotate(-90deg)}
.share-panel {position:absolute;right:0;top:calc(100% + 8px);z-index:21;width:min(350px,calc(100vw - 32px));max-height:calc(100dvh - 160px);overflow-y:auto;padding:14px;border:1px solid var(--line);background:var(--surface);border-radius:12px;box-shadow:var(--modal-shadow)}
.share-panel .share-buttons .primary {width:100%}
.share-panel .share-buttons .button:not(.primary) {flex:1}
.share-status {padding:10px 12px;border:1px solid var(--line);background:var(--bg);border-radius:9px;font-size:12px;line-height:1.6;margin-bottom:10px;overflow-wrap:anywhere}
.share-buttons {display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.note {font-size:11px;color:var(--muted);line-height:1.9;margin:12px 0 0}
.checkbox-label {display:flex;align-items:flex-start;gap:8px;font-size:12px;margin:13px 0}
.checkbox-label input {margin-top:5px;accent-color:var(--accent)}
kbd {font-size:10px;background:var(--soft);border:1px solid var(--line);border-radius:4px;padding:1px 4px}
.toast {position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:30;background:var(--accent);color:var(--on-accent);padding:12px 20px;border-radius:12px;box-shadow:0 8px 28px #0002;font-size:13px;max-width:min(560px,calc(100% - 30px));text-align:center}
.toast.error {background:var(--danger-bg);color:var(--danger);border:1px solid var(--danger-line)}
noscript {display:block;padding:20px;color:var(--danger)}
@media(min-width:1100px) {
  .column {height:calc(100dvh - 292px);min-height:420px}
  .card-list {overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
  body:has(.reminder:not([hidden])) .column {height:calc(100dvh - 356px)}
}
@media(max-width:1050px) {
  .app {padding:25px 24px 18px}
  .board {gap:12px}
  .card-list {padding:0 10px 10px}
  .column-head {padding:17px 15px 14px}
  .column {min-height:530px}
}
@media (min-width:721px) and (max-width:1440px), (max-width:480px) {
  .card-row {grid-template-columns:64px minmax(0,1fr) 55px;gap:4px 8px}
  .card-time-block {grid-column:1;grid-row:1 / span 2;align-self:start}
  .task-title {grid-column:2;grid-row:1}
  .card-assignees {grid-column:2;grid-row:2;flex-direction:row;flex-wrap:wrap;gap:2px 8px}
  .card-assignees .assignee {max-width:100%}
  .card-buttons {grid-column:3;grid-row:1 / span 2;align-self:start}
}
@media(max-width:480px) {
  .assignee-fields {grid-template-columns:1fr;gap:0}
}
@media(max-width:720px) {
  .app {padding:20px 16px 18px}
  .header {align-items:flex-start;margin-bottom:23px;gap:12px;flex-wrap:wrap}
  .brand-mark {width:39px;height:39px;padding:9px 7px;gap:3px;border-radius:12px}
  .brand-mark .icon {width:24px;height:24px}
  .brand {gap:10px}
  h1 {font-size:22px}
  .clock {font-size:22px}
  .header-right {gap:10px;flex-wrap:wrap;justify-content:flex-end;flex:1}
  .header-right > .button {padding:8px 12px}
  .header-right > .button .button-label {display:none}
  .header-right > .button.primary .button-label {display:inline}
  .clock {display:none}
  .toolbar {flex-wrap:wrap;gap:12px}
  .toolbar-right {width:100%}
  .search {max-width:none;flex:1;min-width:0}
  .toolbar-right {gap:8px}
  .mine-filter {padding:9px 10px;font-size:11px}
  .board {grid-template-columns:1fr;gap:16px}
  .column {min-height:260px}
  .card-list {min-height:140px}
  .empty {min-height:150px}
  .summary {padding:14px 0}
  .summary-title span {display:block;margin-left:0;font-size:11px}
  .progress-group {min-width:130px;gap:7px}
  .progress-track {width:68px}
  .reminder {align-items:flex-start;gap:8px;font-size:12px;padding:12px}
  .reminder .icon {margin-top:3px}
  .reminder .button {padding:5px 8px}
  .footer {align-items:flex-start}
  .dialog-head {padding:19px 20px 15px}
  .dialog-body {padding:19px 20px}
  .dialog-foot {padding:14px 20px 20px}
}
@media(prefers-reduced-motion:reduce) {
  *,*::before,*::after {transition:none!important;scroll-behavior:auto!important}
}
</style>
</head>

<svg style="display:none" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
<symbol id="i-task" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="m7.5 8 1.5 1.5 2.5-3M13 8.5h3m-8.5 6 1.5 1.5 2.5-3M13 15h3"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
<symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
<symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v4M17 3v4M3 10h18M7 14h2M13 14h2"/></symbol>

<script id="taskboard-core">
'use strict';
(function(global) {
  const STATUSES = ['pending','progress','done'];
  const REQUIRED_FIELDS = ['date','time','title','assignee','notes','status'];
  const FIELDS = [...REQUIRED_FIELDS,'assignee2','deleted','demo'];
  const validDate = function(value) {
    if (typeof value !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(value)) return false;
    const [y,m,d] = value.split('-').map(Number);
    if (y < 1900 || y > 9999 || m < 1 || m > 12 || d < 1) return false;
    return new Date(y,m,0).getDate() >= d;
  };
  const validTime = function(value) {return typeof value === 'string' && /^([01]\d|2[0-3]):[0-5]\d$/.test(value);};
  function validPersonalName(value) {return typeof value==='string' && value.trim().length>0 && value.trim().length<=100;}
  function normalizeName(value) {return String(value).normalize('NFKC').replace(/\s+/g,'').toLocaleLowerCase();}
  function isAssignedToMe(task,name) {
    return validPersonalName(name) && [task.assignee,task.assignee2].some(function(value){
      return typeof value==='string' && normalizeName(value)===normalizeName(name);
    });
  }
  function filterTasks(tasks,query,name,onlyMine) {
    const text=String(query||'').trim().toLocaleLowerCase();
    return tasks.filter(function(task){
      return (!onlyMine || isAssignedToMe(task,name)) && (!text || (task.title+' '+task.assignee+' '+(task.assignee2||'')+' '+task.notes).toLocaleLowerCase().includes(text));
    });
  }
  function validField(key,value) {
    if(key === 'date') return validDate(value);
    if(key === 'time') return validTime(value);
    if(key === 'status') return STATUSES.includes(value);
    if(key === 'deleted' || key === 'demo') return typeof value === 'boolean';
    if(key === 'title') return typeof value === 'string' && value.trim().length > 0 && value.length <= 200;
    if(key === 'assignee' || key === 'assignee2') return typeof value === 'string' && value.length <= 100;
    if(key === 'notes') return typeof value === 'string' && value.length <= 6000;
    return false;
  }
  function backupTaskPatch(task) {
    if(!task || typeof task!=='object' || Array.isArray(task))throw new Error('バックアップに不正なタスクが含まれています。');
    const patch={};
    for(const key of REQUIRED_FIELDS) {
      if(!validField(key,task[key]))throw new Error('バックアップに不正なタスクが含まれています。');
      patch[key]=task[key];
    }
    patch.assignee2=task.assignee2===undefined?'':task.assignee2;
    if(!validField('assignee2',patch.assignee2))throw new Error('バックアップに不正な担当者②が含まれています。');
    return patch;
  }
  function validOperation(op) {
    if(!op || op.v !== 1 || typeof op.id !== 'string' || !/^[a-zA-Z0-9-]{8,80}$/.test(op.id)
       || typeof op.taskId !== 'string' || !/^[a-zA-Z0-9-]{8,80}$/.test(op.taskId)
       || !Number.isSafeInteger(op.seq) || op.seq < 1 || !op.patch || Array.isArray(op.patch)) return false;
    const keys = Object.keys(op.patch);
    return keys.length > 0 && keys.every(function(key){return FIELDS.includes(key) && validField(key,op.patch[key]);});
  }
  function compareClock(a,b) {return a[0] - b[0] || (a[1]<b[1]?-1:a[1]>b[1]?1:0);}
  function reduceOperations(ops) {
    const records = new Map();
    for(const op of ops) {
      if(!validOperation(op)) continue;
      if(!records.has(op.taskId)) records.set(op.taskId,{id:op.taskId,fields:{},clocks:{}});
      const task = records.get(op.taskId);
      for(const key of Object.keys(op.patch)) {
        const clock = [op.seq,op.id];
        if(!task.clocks[key] || compareClock(clock,task.clocks[key]) > 0) {
          task.fields[key] = op.patch[key]; task.clocks[key] = clock;
        }
      }
    }
    const tasks = [];
    for(const record of records.values()) {
      const f = record.fields;
      if(f.deleted || !REQUIRED_FIELDS.every(function(k){return validField(k,f[k]);})) continue;
      tasks.push(Object.assign({id:record.id,assignee2:''},f));
    }
    return tasks;
  }
  function sortedTasks(tasks) {
    return tasks.slice().sort(function(a,b){return a.date.localeCompare(b.date) || a.time.localeCompare(b.time) || a.id.localeCompare(b.id,'en');});
  }
  function dueTime(task) {return new Date(task.date + 'T' + task.time + ':00').getTime();}
  function isOverdue(task,now) {return task.status === 'pending' && dueTime(task) < Number(now);}
  function nextSequence(ops) {let max=0;for(const op of ops) max=Math.max(max,op.seq);return max+1;}
  class FolderStore {
    constructor(handle) {this.handle=handle;this.operations=new Map();this.unread=0;this.refreshing=null;}
    refresh() {
      if(this.refreshing) return this.refreshing;
      this.refreshing=this._refresh().finally(()=>{this.refreshing=null;});
      return this.refreshing;
    }
    async _refresh() {
      const unknown=[];
      for await(const [name,handle] of this.handle.entries()) {
        if(handle.kind==='file' && /^op-[a-zA-Z0-9-]{8,80}\.json$/.test(name) && !this.operations.has(name.slice(3,-5))) unknown.push([name,handle]);
      }
      let changed=0,unread=0;
      for(let i=0;i<unknown.length;i+=20) {
        const results=await Promise.all(unknown.slice(i,i+20).map(async ([name,handle])=>{
          try {
            const file=await handle.getFile();
            if(file.size > 50000) return null;
            const op=JSON.parse(await file.text());
            if(!validOperation(op) || op.id!==name.slice(3,-5)) return null;
            return op;
          } catch(error) {return null;}
        }));
        for(const op of results) {if(op) {if(!this.operations.has(op.id)) changed++;this.operations.set(op.id,op);} else unread++;}
      }
      this.unread=unread;
      return changed;
    }
    async append(op) {
      if(!validOperation(op)) throw new Error('保存するタスクの形式が正しくありません。');
      const file=await this.handle.getFileHandle('op-'+op.id+'.json',{create:true});
      const writer=await file.createWritable();
      try {await writer.write(JSON.stringify(op));await writer.close();}
      catch(error) {try {await writer.abort();}catch(_){}throw error;}
      this.operations.set(op.id,op);
    }
  }
  global.TaskBoardCore={STATUSES,REQUIRED_FIELDS,FIELDS,validDate,validTime,validPersonalName,isAssignedToMe,filterTasks,validField,backupTaskPatch,validOperation,reduceOperations,sortedTasks,dueTime,isOverdue,nextSequence,FolderStore};
})(typeof window!=='undefined'?window:globalThis);
</script>
<script id="taskboard-app">
'use strict';
(function() {
  const C=window.TaskBoardCore;
  const $=function(id){return document.getElementById(id);};
  const labels={pending:'未対応',progress:'対応中',done:'完了'};
  const PREFIX='tag-taskboard-v1:';
  const LOCAL_PREFIX=PREFIX+'local-op:';
  const PROFILE_KEY=PREFIX+'my-name';
  const state={mode:'local',ops:new Map(),tasks:[],selectedDate:today(),expanded:new Set(),store:null,config:null,syncState:'local',lastSync:null,dragging:null,renderPending:false,writing:0,queue:Promise.resolve(),editing:null,previousOverdue:null,booting:true,myName:readMyName(),onlyMine:false};
  let toastTimer,dbPromise,dragInteractive=false,dialogBusy=false,profileAction=null,activeMenu=null;
  const uuid=function(){return globalThis.crypto&&crypto.randomUUID?crypto.randomUUID():'tb-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2)+'-'+Math.random().toString(36).slice(2);};
  function today(){return localDate(new Date());}
  function localDate(d){return String(d.getFullYear()).padStart(4,'0')+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
  function relativeDate(amount){const date=new Date(today()+'T12:00:00');date.setDate(date.getDate()+amount);return localDate(date);}
  function readMyName(){try{const name=localStorage.getItem(PROFILE_KEY);return C.validPersonalName(name)?name.trim():'';}catch(_){return '';}}
  function updatePersonalUI() {
    $('profile-label').textContent=state.myName||'名前を登録';
    $('profile-button').title=state.myName?'自分の名前を変更：'+state.myName:'自分の名前を登録';
    $('profile-button').setAttribute('aria-label',$('profile-button').title);
    $('mine-filter').setAttribute('aria-pressed',String(state.onlyMine));
    $('mine-filter').title=state.myName?'担当者①・②のどちらかが「'+state.myName+'」のタスクに絞り込みます':'名前を登録して自分のタスクに絞り込みます';
    $('assign-me').title=state.myName?'担当者①に「'+state.myName+'」を入力します':'名前を登録して担当者①に入力します';
    $('assign-me2').title=state.myName?'担当者②に「'+state.myName+'」を入力します':'名前を登録して担当者②に入力します';
  }
  function openProfile(action) {
    if(dialogBusy||state.booting)return;
    profileAction=action||null;
    $('profile-dialog-title').textContent=state.myName?'自分の名前を変更':'自分の名前を登録';
    $('profile-name').value=state.myName;
    $('profile-save').textContent=state.myName?'保存する':'登録する';
    $('profile-cancel').textContent=state.myName?'キャンセル':'あとで';
    showError('profile-error','');
    $('profile-dialog').showModal();$('profile-name').focus();
  }
  function assignMe(field) {
    if(dialogBusy)return;
    if(!state.myName){openProfile(field);return;}
    $(field).value=state.myName;$(field).focus();
  }
  $('profile-button').addEventListener('click',function(){openProfile();});
  $('assign-me').addEventListener('click',function(){assignMe('task-assignee');});
  $('assign-me2').addEventListener('click',function(){assignMe('task-assignee2');});
  $('mine-filter').addEventListener('click',function(){
    if(dialogBusy||state.booting)return;
    if(!state.myName){openProfile('filter');return;}
    state.onlyMine=!state.onlyMine;render();
  });
  $('profile-form').addEventListener('submit',function(event){
    event.preventDefault();if(dialogBusy)return;
    const name=$('profile-name').value.trim();
    if(!C.validPersonalName(name)){showError('profile-error','名前を1〜100文字で入力してください。');return;}
    try{localStorage.setItem(PROFILE_KEY,name);}
    catch(_){showError('profile-error','このブラウザに名前を記憶できません。ブラウザの保存設定を確認してください。');return;}
    const action=profileAction;
    state.myName=name;
    if(action==='filter')state.onlyMine=true;
    $('profile-dialog').close();profileAction=null;render();
    if((action==='task-assignee'||action==='task-assignee2')&&$('task-dialog').open)assignMe(action);
    toast('自分の名前を登録しました。');
  });
  $('profile-dialog').addEventListener('close',function(){profileAction=null;});
  function icon(name){const el=document.createElementNS('http://www.w3.org/2000/svg','svg');el.classList.add('icon');el.setAttribute('aria-hidden','true');const use=document.createElementNS('http://www.w3.org/2000/svg','use');use.setAttribute('href','#i-'+name);el.append(use);return el;}
  function node(tag,cls,text){const el=document.createElement(tag);if(cls)el.className=cls;if(text!==undefined)el.textContent=text;return el;}
  function toast(message,error){clearTimeout(toastTimer);const el=$('toast');el.textContent=message;el.classList.toggle('error',!!error);el.hidden=false;toastTimer=setTimeout(function(){el.hidden=true;},error?6500:3200);}
  function showError(id,message){$(id).textContent=message;$(id).hidden=!message;}
  function errorText(error) {
    if(error&&error.name==='NotAllowedError') return '共有フォルダのアクセス許可が必要です。「設定」から再接続してください。';
    if(error&&error.name==='SecurityError') return 'この環境ではフォルダ接続が許可されていません。Edge／Chromeで開くか、社内のブラウザ設定を確認してください。';
    return error&&error.message?error.message:'保存できませんでした。共有フォルダの接続と書き込み権限を確認してください。';
  }
  function readLocal() {
    const ops=new Map();
    try {

  function db() {

      const request=indexedDB.open('tag-taskboard-v1',1);
      request.onupgradeneeded=function(){request.result.createObjectStore('settings');};
      request.onsuccess=function(){resolve(request.result);};

  async function setting(action,value) {
    const database=await db();
    return new Promise(function(resolve,reject){
      const tx=database.transaction('settings',action==='get'?'readonly':'readwrite');
      const store=tx.objectStore('settings');
      const request=action==='get'?store.get('connection'):action==='put'?store.put(value,'connection'):store.delete('connection');
      let result;
      request.onsuccess=function(){result=request.result;};
      tx.oncomplete=function(){resolve(result);};tx.onerror=function(){reject(tx.error);};tx.onabort=function(){reject(tx.error);};

  async function syncShared(strict) {
    if(state.mode!=='shared'||!state.store)return;
    const store=state.store;
    try {
      const changed=await store.refresh();
      if(state.store!==store)return;
      state.ops=store.operations;
      state.syncState=store.unread?'partial':'ok';
      state.lastSync=new Date();
      cacheShared();
      if(changed)rebuild();else refreshReminders();
      if(!store.unread)showError('system-message','');
      else showError('system-message','共有データ '+store.unread+' 件を読み込み待ちです。書き込み中のデータは次の更新で再確認します。');
      updateSaveState();
    } catch(error) {

      showError('system-message',errorText(error));updateSaveState();

  async function savePatch(taskId,patch) {
    return enqueue(async function(){
      state.writing++;updateSaveState();

        if(state.mode==='shared') {

          await syncShared(true);
        } else state.ops=readLocal();
        const history=Array.from(state.ops.values()).filter(function(op){return op.taskId===taskId;});
        const current=C.reduceOperations(history)[0];
        if((history.length&&!current)||(!history.length&&!C.REQUIRED_FIELDS.every(function(k){return C.validField(k,patch[k]);})))throw new Error('このタスクは削除されたか、読み込めていません。入力内容をコピーし、新しいタスクとして追加してください。');
        const op={v:1,id:uuid(),taskId:taskId,seq:C.nextSequence(state.ops.values()),at:new Date().toISOString(),patch:patch};
        if(!C.validOperation(op))throw new Error('入力内容を確認してください。時間とタスクは必須です。');
        if(state.mode==='shared') {
          try{await state.store.append(op);}
          catch(error){state.syncState='error';showError('system-message',errorText(error));throw error;}
          state.ops=state.store.operations;state.lastSync=new Date();cacheShared();
        } else {
          try{localStorage.setItem(LOCAL_PREFIX+op.id,JSON.stringify(op));}
          catch(error){throw new Error('このブラウザに保存できません。共有フォルダを接続するか、保存領域を確認してください。');}
          state.ops.set(op.id,op);
        }

      } finally {state.writing--;updateSaveState();}
    });
  }

        el.textContent=minutes===0?'時刻超過':minutes<60?minutes+'分超過':minutes<1440?Math.floor(minutes/60)+'時間超過':Math.floor(minutes/1440)+'日超過';

  }
  $('share-dialog').addEventListener('toggle',function(){if(this.open){showError('share-error','');$('publish-local').checked=false;updateShareDialog();}});
  document.addEventListener('pointerdown',function(event){if($('share-dialog').open&&!$('share-dialog').contains(event.target))$('share-dialog').open=false;},true);
  document.addEventListener('keydown',function(event){if(event.key==='Escape'&&$('share-dialog').open){$('share-dialog').open=false;$('share-button').focus({preventScroll:true});}});
  async function connectFolder() {
    if(state.writing||dialogBusy)return;
    if(!('showDirectoryPicker'in window)){showError('share-error','Windows版Edge／Chromeで開いてください。このブラウザはフォルダ接続に対応していません。');return;}
    let publish=state.mode==='local'&&$('publish-local').checked?state.tasks.slice():[];
    try {
      const root=await window.showDirectoryPicker({id:'tag-taskboard-shared',mode:'readwrite'});
      dialogBusy=true;updateShareDialog();
      const handle=root.name==='TaskBoard_Data'?root:await root.getDirectoryHandle('TaskBoard_Data',{create:true});
      let same=false;
      try{same=!!state.config&&await state.config.handle.isSameEntry(handle);}catch(_){}
      const config={handle:handle,parentName:root.name==='TaskBoard_Data'?'選択した共有フォルダ':root.name,cacheId:same?state.config.cacheId:uuid()};
      const store=new C.FolderStore(handle);
      await store.refresh();
      try{await setting('put',config);}catch(_){toast('共有先の記憶ができません。次回はもう一度フォルダを選択してください。',true);}
      state.config=config;state.store=store;state.mode='shared';state.ops=store.operations;state.syncState=store.unread?'partial':'ok';state.lastSync=new Date();cacheShared();showError('system-message','');state.expanded.clear();rebuild();
      let added=0;
      try {
        for(const task of publish){const copy={};for(const key of C.FIELDS)if(key!=='deleted'&&task[key]!==undefined)copy[key]=task[key];await savePatch(uuid(),copy);added++;}
      } catch(error){throw new Error(added+' 件追加したところで保存に失敗しました。'+errorText(error));}
      toast('共有フォルダに接続しました。'+(added?' '+added+'件を追加しました。':''));
      showError('share-error','');
    } catch(error){if(error.name!=='AbortError')showError('share-error',errorText(error));}
    finally{dialogBusy=false;updateShareDialog();}
  }
  $('connect-folder').addEventListener('click',connectFolder);
  $('reconnect-folder').addEventListener('click',async function(){
    if(!state.config||state.writing||dialogBusy)return;
    try {
      const allowed=await state.config.handle.requestPermission({mode:'readwrite'});
      if(allowed!=='granted')throw new Error('アクセスが許可されませんでした。「共有フォルダを選択」から接続先を選び直すこともできます。');
      state.store=new C.FolderStore(state.config.handle);
      // Read canonical files afresh; do not treat a cache as proof that shared files still exist.
      await syncShared(true);state.ops=state.store.operations;rebuild();showError('share-error','');toast('共有フォルダに再接続しました。');
    } catch(error){showError('share-error',errorText(error));}
  });
  $('disconnect-folder').addEventListener('click',async function(){
    if(state.writing||dialogBusy)return;
    try{await setting('delete');}
    catch(error){showError('share-error','接続先の記憶を消せませんでした。ブラウザを再起動すると共有の再接続が表示される場合があります。');}
    state.mode='local';state.store=null;state.config=null;state.syncState='local';state.lastSync=null;state.ops=readLocal();state.expanded.clear();showError('system-message','');rebuild();updateShareDialog();toast('このブラウザの個人用タスクに戻りました。');
  });
  $('demo-button').addEventListener('click',async function(){
    if(state.tasks.length||state.mode!=='local'||dialogBusy)return;
    $('demo-button').disabled=true;
    const minutes=new Date().getHours()*60+new Date().getMinutes();
    const time=function(offset){const m=Math.max(0,Math.min(1439,minutes+offset));return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');};
    const examples=[
      {time:time(-15),title:'メールの未仕分を確認',assignee:'田中',status:'pending',notes:'サンプルです。時刻を過ぎた未対応タスクは赤く表示されます。'},
      {time:time(60),title:'日程調整の進捗チェック',assignee:'佐藤',assignee2:'田中',status:'pending',notes:'サンプルです。担当者は2名まで設定でき、予定時刻が早いカードから上に並びます。'},
      {time:time(30),title:'引き継ぎメモを更新',assignee:'鈴木',status:'progress',notes:'サンプルです。この＋ボタンでメモを開閉できます。'},
      {time:time(90),title:'担当者への確認連絡',assignee:'田中',assignee2:'鈴木',status:'progress',notes:'サンプルです。完了したら右の列へドラッグしてみてください。'},
      {time:time(-60),title:'朝の共有事項を確認',assignee:'佐藤',status:'done',notes:'サンプルです。完了したタスクはリマインドの対象になりません。'}
    ];
    try{for(const task of examples)await savePatch(uuid(),Object.assign({date:today(),demo:true},task));toast('サンプルを追加しました。不要になったらカードのメニューから削除できます。');}
    catch(error){toast(errorText(error),true);}finally{$('demo-button').disabled=false;}
  });
  async function boot() {
    state.ops=readLocal();rebuild();
    try {
      const config=await setting('get');
      if(config&&config.handle&&config.cacheId) {
        state.config=config;state.mode='shared';state.ops=readCache(config);state.syncState='paused';rebuild();
        const permission=await config.handle.queryPermission({mode:'readwrite'});
        if(permission==='granted'){state.store=new C.FolderStore(config.handle);await syncShared(false);state.ops=state.store.operations;rebuild();}
        else showError('system-message','前回の共有タスクを表示しています。編集する前に「設定」から再接続してください。');
      }
    } catch(_) {}
    state.booting=false;refreshReminders();updateSaveState();
    if(!state.myName&&!document.querySelector('dialog[open]'))openProfile();
  }
  window.addEventListener('storage',function(event){
    if(event.key===PROFILE_KEY||event.key===null){state.myName=readMyName();if(!state.myName)state.onlyMine=false;render();}
    if(state.mode==='local'&&event.key&&event.key.startsWith(LOCAL_PREFIX)){state.ops=readLocal();rebuild();}
  });
  document.addEventListener('visibilitychange',function(){if(!document.hidden){refreshReminders();syncShared(false);updateClock();}});
  window.addEventListener('beforeunload',function(event){if(state.writing||dialogBusy){event.preventDefault();event.returnValue='';}});
  function updateClock(){$('live-clock').textContent=new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit',hour12:false});updateTaskAddUI();}
  setInterval(updateClock,1000);
  setInterval(function(){if(!document.hidden)refreshReminders();},10000);
  setInterval(function(){if(!document.hidden&&!state.booting&&!dialogBusy)syncShared(false);},3000);
  updateClock();boot();
})();
</script>
</body>
</html>
